name: Inspect auth source
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: contains(github.event.head_commit.message, 'inspect auth source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore bundled source
        run: node bootstrap.mjs
      - name: Print auth-related source
        shell: bash
        run: |
          echo '=== AUTH FILE CANDIDATES ==='
          grep -RIl --exclude-dir=node_modules -E 'scrypt|verifyPassword|password_hash|passwordHash|hashPassword' lib app scripts netlify 2>/dev/null | head -n 50 || true
          echo '=== AUTH MATCHES ==='
          grep -RIn --exclude-dir=node_modules -E 'scrypt|verifyPassword|password_hash|passwordHash|hashPassword' lib app scripts netlify 2>/dev/null | head -n 250 || true
          for f in $(grep -RIl --exclude-dir=node_modules -E 'scrypt|verifyPassword|hashPassword' lib app scripts 2>/dev/null | head -n 10); do
            echo "=== FILE: $f ==="
            sed -n '1,260p' "$f"
          done
