name: Capture digital KPI report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-digital-kpi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture dated dashboard JSON
        shell: bash
        run: |
          set -e
          mkdir -p generated
          curl -L --fail-with-body -sS 'https://buxoro-kpi-production.up.railway.app/api/dashboard?period=daily&date=2026-09-10' -o generated/dashboard-2026-09-10.json
          cat generated/dashboard-2026-09-10.json
      - name: Commit captured dashboard data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/dashboard-2026-09-10.json
          git diff --cached --quiet && exit 0
          git commit -m 'Capture KPI dashboard data for 2026-09-10'
          git push
