name: Capture digital KPI report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-digital-kpi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore source and export hierarchy
        shell: bash
        run: |
          set -e
          npm run preinstall
          mkdir -p generated
          cp lib/kpi-data.ts generated/kpi-data-final.txt
      - name: Commit hierarchy source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/kpi-data-final.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Export KPI hierarchy source'
          git push
