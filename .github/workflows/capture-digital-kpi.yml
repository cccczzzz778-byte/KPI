name: Capture digital KPI report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-digital-kpi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture report from production
        shell: bash
        run: |
          set -e
          mkdir -p generated
          curl -L --fail-with-body -sS 'https://buxoro-kpi-production.up.railway.app/api/reports/digital?date=2026-09-10' -o generated/raqamlashtirish-kpi-2026-09-10.svg
          grep -q '<svg' generated/raqamlashtirish-kpi-2026-09-10.svg
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/raqamlashtirish-kpi-2026-09-10.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Capture digital KPI report for 2026-09-10'
          git push
