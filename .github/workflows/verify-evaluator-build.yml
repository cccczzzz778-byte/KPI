name: Verify evaluator build

on:
  push:
    branches: [evaluator-panel-reference]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
